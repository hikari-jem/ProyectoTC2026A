<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticación de Dos Factores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div id="login-card" class="card">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required placeholder="Ingresa tu usuario">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Ingresa tu contraseña">
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>

        <div id="status-card" class="card hidden">
            <h2>Verificación en Dos Pasos</h2>
            <p>Por favor, abre la aplicación en tu teléfono móvil para autorizar el acceso.</p>
            
            <div class="spinner-container">
                <div id="loading-spinner" class="spinner"></div>
                <div id="status-icon" class="status-icon"></div>
            </div>
            
            <p id="status-message" class="status-text text-pending">Esperando aprobación móvil...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
